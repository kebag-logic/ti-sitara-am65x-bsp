menu title PocketBeagle 2 microSD (TDM8 -> UAC2 / Ethernet Cap)
timeout 30
prompt 1
default ethcap
label tdm8
    menu label Linux 7.1.0-tdm8-pb2-rt + TDM8 8x8 on McASP0 (P2.01/P1.04/P1.02/P2.03)
    kernel /Image-7.1.0-tdm8-pb2-rt.gz
    fdtdir /
    fdt /ti/k3-am62-pocketbeagle2-tdm8.dtb
    append console=ttyS3,115200n8 earlycon=ns16550a,mmio32,0x02800000,115200n8 no-console-suspend root=/dev/mmcblk1p2 ro rootfstype=ext4 rootwait net.ifnames=0
label tdm8-async
    menu label Linux 7.1.0-tdm8-pb2-rt + TDM8 8x8 on McASP0, separate RX clocks (+P1.08/P1.06, UART1 off)
    kernel /Image-7.1.0-tdm8-pb2-rt.gz
    fdtdir /
    fdt /ti/k3-am62-pocketbeagle2-tdm8-async.dtb
    append console=ttyS3,115200n8 earlycon=ns16550a,mmio32,0x02800000,115200n8 no-console-suspend root=/dev/mmcblk1p2 ro rootfstype=ext4 rootwait net.ifnames=0
label notdm8
    menu label Linux 7.1.0-tdm8-pb2-rt, stock PocketBeagle 2 device tree (TDM8 off)
    kernel /Image-7.1.0-tdm8-pb2-rt.gz
    fdtdir /
    fdt /ti/k3-am62-pocketbeagle2.dtb
    append console=ttyS3,115200n8 earlycon=ns16550a,mmio32,0x02800000,115200n8 no-console-suspend root=/dev/mmcblk1p2 ro rootfstype=ext4 rootwait net.ifnames=0
label ethcap
    menu label Linux 7.1.0-tdm8-pb2-rt + Kebag-Logic Ethernet Cap rev B (DP83867 on RGMII2, eth0)
    kernel /Image-7.1.0-tdm8-pb2-rt.gz
    fdtdir /
    fdt /ti/k3-am62-pocketbeagle2-ethcap.dtb
    append console=ttyS3,115200n8 earlycon=ns16550a,mmio32,0x02800000,115200n8 no-console-suspend root=/dev/mmcblk1p2 ro rootfstype=ext4 rootwait net.ifnames=0 isolcpus=nohz,domain,managed_irq,3 nohz_full=3 rcu_nocbs=3 irqaffinity=0-2
