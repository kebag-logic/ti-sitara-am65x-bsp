# RAUC on the PocketBeagle 2 A/B card (issue #27). The bootnames are the ones
# the U-Boot bootchooser (res/ab/pb2-boot.cmd.in) keeps in BOOT_ORDER.
[system]
compatible=pocketbeagle2-am62x
bootloader=uboot
statusfile=per-slot

# the BSP's development certificate (res/rauc/rauc-dev.cert.pem).
#
# The board has no RTC and no NTP: its clock starts at 1970, before any
# certificate is valid ("certificate is not yet valid"). The certificate is
# checked at the time the bundle was signed instead.
[keyring]
path=/etc/rauc/keyring.pem
use-bundle-signing-time=true

[slot.rootfs.0]
device=/dev/mmcblk1p2
type=ext4
bootname=A

[slot.rootfs.1]
device=/dev/mmcblk1p3
type=ext4
bootname=B

# The boot partition: tiboot3.bin, tispl.bin, u-boot.img and the bootchooser.
# The card reserves twice its size from 1 MiB (build-tdm8-uac2-pb2.sh abcard,
# AB_BOOT_MB). RAUC writes a new boot partition into the half p1 does not use,
# then moves p1 onto it in the MBR: one sector write, so a power cut leaves
# the old bootloader or the new one, never half of one. There is no fallback,
# though: a bootloader that does not boot needs the card reflashed.
[slot.bootloader.0]
device=/dev/mmcblk1
type=boot-mbr-switch
region-start=1M
region-size=600M
