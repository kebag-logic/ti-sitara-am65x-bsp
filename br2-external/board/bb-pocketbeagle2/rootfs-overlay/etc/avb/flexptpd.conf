# flexptpd on the PocketBeagle 2 Ethernet Cap (avb-gptp.sh, issues #4 and #19):
# flexPTP CLI commands, one per line, applied once the gPTP preset is loaded.

# The clock dataset of an 802.1AS end station that may become grandmaster.
# The bench grandmaster wins with anything better than priority1 248.
ptp priority 248 248

# asCapable (IEEE 802.1AS-2020 11.2.2): a link delay at most 800 ns, and up to
# 9 consecutive Pdelay_Req unanswered
ptp gptp nbthresh 800
ptp gptp lostresp 9

# The event log: port state and grandmaster (on by default), asCapable,
# losses, lock
ptp log info on
ptp log locked on

# Reverse sync: the recovered clock sent back to a tester (Avnu egress
# method), on another domain. Only for a tester linked directly to the PB2,
# never through a shared bridge.
# ptp rsync domain 1
# ptp rsync rate 90
# ptp rsync on
