#
# 802.1AS (gPTP) for the PocketBeagle 2 Ethernet Cap: ptp4l on eth0 with the
# CPTS hardware clock. The attributes are those of the pipewire-helper
# gPTP.cfg used on the other AM62x boards; see README.pb2-tsn.md.
#
[global]
gmCapable		1
priority1		248
priority2		248
logAnnounceInterval	0
logSyncInterval		-3
syncReceiptTimeout	3
neighborPropDelayThresh	800
min_neighbor_prop_delay	-20000000
assume_two_step		1
path_trace_enabled	1
follow_up_info		1
transportSpecific	0x1
ptp_dst_mac		01:80:C2:00:00:0E
network_transport	L2
delay_mechanism		P2P
time_stamping		hardware
# the CPTS reports TX timestamps through a work item, slower than the 1 ms default
tx_timestamp_timeout	20
# the read-only management socket both bridge paths read (GM, asCapable)
uds_ro_address		/var/run/ptp4lro
